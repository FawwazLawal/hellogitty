<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 420px; height: 540px; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px;
    background: #18181b; border-bottom: 1px solid #27272a; }
  .bar span { font-size: 12px; font-weight: 600; color: #a1a1aa; letter-spacing: 0.02em; }
  .bar a { font-size: 11px; color: #a1a1aa; text-decoration: none; }
  .bar a:hover { color: #d4d4d8; }
  iframe { width: 100%; height: calc(100% - 33px); border: 0; background: #0a0a0b; }
  .err { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    height: calc(100% - 33px); color: #a1a1aa; font-size: 13px; text-align: center; padding: 20px; background: #0a0a0b; }
  .err strong { color: #d4d4d8; font-size: 14px; }
  .err code { font-size: 12px; color: #a1a1aa; }
</style>
</head>
<body>
<div class="bar">
  <span>HelloGitty</span>
  <a href="#" id="open-tab">Open in tab &#8599;</a>
</div>
<iframe id="dash" src="http://localhost:7340/?ext=popup"></iframe>
<div class="err" id="err">
  <strong>HelloGitty is not running</strong>
  <span>Start the dashboard, then reopen this popup.</span>
  <code>localhost:7340</code>
</div>
<script>
  var frame = document.getElementById("dash");
  var err = document.getElementById("err");

  document.getElementById("open-tab").addEventListener("click", function (e) {
    e.preventDefault();
    chrome.tabs.create({ url: "http://localhost:7340/" });
    window.close();
  });

  frame.addEventListener("error", show_error);
  frame.addEventListener("load", function () {
    try {
      if (!frame.contentDocument || !frame.contentDocument.title) show_error();
    } catch (e) {
      // cross-origin load succeeded — dashboard is running
    }
  });

  // If the iframe fails to connect, the load event may still fire but the
  // document will be empty. Fall back to a fetch check after a short delay.
  setTimeout(function () {
    fetch("http://localhost:7340/", { mode: "no-cors" }).catch(show_error);
  }, 2000);

  function show_error() {
    frame.style.display = "none";
    err.style.display = "flex";
  }
</script>
</body>
</html>
