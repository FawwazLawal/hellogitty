<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 104" role="img" aria-label="Luz, a paper-cut calavera messenger with a marigold crown and jewel scarf" width="96" height="104">
  <!-- Marigold crown: three stacked petal clusters, left/centre/right -->
  <g fill="currentColor" style="color: var(--pack-flower-marigold, #ffc050)">
    <circle cx="20" cy="18" r="12"/>
    <circle cx="48" cy="12" r="13"/>
    <circle cx="76" cy="18" r="12"/>
  </g>
  <g fill="currentColor" style="color: var(--pack-flower-papaya, #ff7240)">
    <circle cx="20" cy="18" r="6"/>
    <circle cx="48" cy="12" r="7"/>
    <circle cx="76" cy="18" r="6"/>
  </g>
  <!-- Calavera head: cream paper over violet rim -->
  <path d="M22 32 Q48 10 74 32 Q82 52 76 72 Q66 90 48 92 Q30 90 20 72 Q14 52 22 32 Z"
        fill="#fff2df" stroke="#5944a5" stroke-width="2.5"/>
  <!-- Eye sockets: petal-shaped flowers, not plain holes -->
  <g>
    <ellipse cx="36" cy="52" rx="7" ry="9" fill="#2a1f3d"/>
    <ellipse cx="60" cy="52" rx="7" ry="9" fill="#2a1f3d"/>
    <circle cx="36" cy="52" r="2.5" fill="currentColor" style="color: var(--pack-flower-pink, #ff78be)"/>
    <circle cx="60" cy="52" r="2.5" fill="currentColor" style="color: var(--pack-flower-jade, #6de4d0)"/>
    <!-- Petal rays around each eye for the folk-illustration motif -->
    <g fill="#5944a5" opacity=".7">
      <circle cx="36" cy="40" r="1.6"/><circle cx="36" cy="64" r="1.6"/>
      <circle cx="26" cy="52" r="1.6"/><circle cx="46" cy="52" r="1.6"/>
      <circle cx="60" cy="40" r="1.6"/><circle cx="60" cy="64" r="1.6"/>
      <circle cx="50" cy="52" r="1.6"/><circle cx="70" cy="52" r="1.6"/>
    </g>
  </g>
  <!-- Heart-shaped nose -->
  <path d="M48 62 L44 68 L48 74 L52 68 Z" fill="currentColor" style="color: var(--pack-flower-pink, #ff78be)"/>
  <!-- Smile stitched as a jewel row -->
  <g fill="currentColor" style="color: var(--pack-flower-indigo, #a99dff)">
    <circle cx="36" cy="80" r="1.6"/><circle cx="42" cy="82" r="1.6"/>
    <circle cx="48" cy="83" r="1.6"/><circle cx="54" cy="82" r="1.6"/>
    <circle cx="60" cy="80" r="1.6"/>
  </g>
  <!-- Jewel scarf under the chin -->
  <path d="M26 92 Q48 102 70 92 L70 100 Q48 104 26 100 Z"
        fill="currentColor" style="color: var(--pack-flower-jade, #6de4d0)" stroke="#5944a5" stroke-width="1.5"/>
  <path d="M30 94 L34 100 M40 96 L42 102 M54 96 L52 102 M62 94 L58 100"
        stroke="currentColor" style="color: var(--pack-flower-marigold, #ffc050)" stroke-width="1.4" fill="none"/>
</svg>
