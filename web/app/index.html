<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The scaffold default. Every mounted page overrides this via the
      `usePageTitle` hook (see src/hooks/usePageTitle.ts). This value
      only shows for the few milliseconds before React mounts, or on a
      page that forgets to set its own — matching the templated
      "HelloGitty" base title.
    -->
    <title>HelloGitty</title>
    <script>
      /*
       * Pre-paint theme init — mirrors the templated page's inline script
       * at `web/index.html:536–538` so the two surfaces apply the same
       * attributes before first paint.
       *
       * ALSO migrates pre-2b identity names (vermilion / azure / bone) to
       * the pack+appearance pair the cascade reads — oni + amoled / dark /
       * light respectively. Idempotent: a value that isn't one of those
       * three passes through. ThemeProvider runs the same migration on
       * mount as a defence in depth; this script runs first and prevents
       * the brief flash of wrong colours on first load.
       */
      (function () {
        try {
          var vt = localStorage.getItem('hellogitty-visual-theme');
          var oniMap = { vermilion: 'amoled', azure: 'dark', bone: 'light' };
          if (vt && oniMap[vt]) {
            localStorage.setItem('hellogitty-visual-theme', 'oni');
            localStorage.setItem('hellogitty-theme', oniMap[vt]);
            vt = 'oni';
          }
          if (vt) document.documentElement.setAttribute('data-visual-theme', vt);

          var t = localStorage.getItem('hellogitty-theme');
          if (t === 'light' || t === 'dark' || t === 'amoled') {
            document.documentElement.setAttribute('data-theme', t);
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          /* storage blocked: fall through to the OS-resolved default */
        }
      })();
    </script>

    <link rel="modulepreload" crossorigin href="/app/assets/usePageTitle-BRTi_517.js">
