name: Build Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hello_Gitty_Ext
        uses: actions/checkout@v4

      - name: Check out hellogitty source
        uses: actions/checkout@v4
        with:
          repository: FawwazLawal/hellogitty
          path: hellogitty

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: hellogitty/go.sum

      - name: Build extension
        run: ./build.sh
        env:
          HELLOGITTY_ROOT: ${{ github.workspace }}/hellogitty

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hellogitty-extension
          path: dist/
