name: CI

# Every pull request runs CI, whatever it targets. A base filter here looks harmless but is a
# silent hole: a PR opened against the wrong base gets no checks at all -- not pending, never
# created -- and retargeting it to dev does not re-fire the trigger, so the PR sits there looking
# clean because nothing ever ran. A check that cannot go red is not a check.
on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - name: Build
        run: go build ./cmd/hellogitty

      - name: Vet
        run: go vet ./...

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - name: Test
        run: go test ./...

  # THE FRONTEND HAD NO CI AT ALL.
  #
  # Every check on this repository was Go-only: build, vet, test. The React
  # app — its types, its unit tests, and the bundle the Go binary embeds —
  # was verified on contributors' machines and nowhere else.
  #
  # That let a specific thing through. Pages are converted on branches that
  # commit source without rebuilding `web/app`, because two branches that each
  # commit a bundle conflict on every single merge. The bundle is then rebuilt
  # once at integration. Nothing enforced the "once at integration" half, so
  # `dev` could carry a React page whose code was not in the bundle its own
  # binary serves — the page simply would not exist at runtime, while every
  # check stayed green and the diff looked complete.
  #
  # The last step is the one that catches it: build the bundle and require the
  # result to match what is committed. A rebuild that changes a byte fails.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile so the bundle is built from the resolution that is
      # committed. Without it a float in a transitive dependency changes the
      # output and the comparison below fails for a reason nobody introduced.
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: pnpm exec vitest run

      - name: Build
        working-directory: frontend
        run: pnpm run build

      # THE FIRST-LOAD JAVASCRIPT BUDGET, WHERE IT CAN ACTUALLY RUN.
      #
      # frontend/e2e/budget.spec.ts is the thorough version, but it is
      # Playwright and CI does not run Playwright. So `motion` crossed a
      # 150 KB ceiling and landed on dev at 197 KB with every check green:
      # the gate existed, was correct, and simply never executed on the
      # path that merges code.
      #
      # This step is the one that stands between a regression and dev.
      # The Playwright spec stays the detailed version. If the two ever
      # disagree, the two measurements have to be made to match; neither
      # is authoritative over the other just by convention.
      #
      # WHAT COUNTS AS FIRST-LOAD JAVASCRIPT.
      #
      # Every script the browser fetches before first paint:
      #   - the entry `<script type="module" src="...">`
      #   - every `<link rel="modulepreload" href="...">` the HTML lists
      # A lazily-imported route chunk is reached through a dynamic import
      # and is NOT in `index.html`, so it is not counted — that is the
      # whole point of the lazy-loading work.
      #
      # An earlier form of this step grepped the FIRST `assets/*.js` and
      # measured that one chunk. That was correct when `index.html`
      # carried a single script; when Vite split jsx-runtime and the
      # shared `usePageTitle` chunk off, the gate kept passing while
      # measuring about three quarters of what the browser downloads,
      # and reported a 30 KB "improvement" for a change that grew
      # first-load by 5 KB (see #332).
      #
      # GZIP FORM.
      #
      # `gzip -6 -c <file>` embeds the filename in its header, so the
      # measured size depends on what the file is called — up to 25 bytes
      # per chunk, and a longer chunk name genuinely moves the figure
      # without changing shipped code. We pipe stdin instead, so the
      # number is the content alone and is reproducible by anyone on any
      # path. A browser does not download the gzip filename header, so
      # stdin is also the more faithful proxy for transfer size.
      #
      # WHY NOT CSS.
      #
      # The step is named "First-load JavaScript budget" and measures
      # JavaScript. CSS has its own budget in budget.spec.ts (12 KB gzip,
      # currently well inside it). Lumping them into one number would
      # hide where a regression sits; a JS bloat and a CSS bloat need
      # different fixes.
      - name: First-load JavaScript budget
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          HTML=../web/app/index.html

          # Every script the browser fetches before first paint:
          # the entry `<script src=...>` and every `<link rel=modulepreload>`.
          # Order-preserving dedupe keeps the per-chunk breakdown readable.
          # `mapfile` would be cleaner but is a bash 4+ builtin; a while-read
          # loop works on every runner we might land on.
          CHUNKS=""
          CHUNK_COUNT=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            CHUNKS="$CHUNKS$line"$'\n'
            CHUNK_COUNT=$((CHUNK_COUNT + 1))
          done < <(
            grep -oE '<script[^>]+src="/app/assets/[^"]+\.js"|<link[^>]*rel="modulepreload"[^>]*href="/app/assets/[^"]+\.js"|<link[^>]*href="/app/assets/[^"]+\.js"[^>]*rel="modulepreload"' "$HTML" \
              | grep -oE '/app/assets/[^"]+\.js' \
              | sed 's|^/app/||' \
              | awk '!seen[$0]++'
          )

          if [ "$CHUNK_COUNT" -eq 0 ]; then
            echo "::error::no first-paint scripts found in $HTML; this check would measure nothing"
            exit 1
          fi

          LIMIT=$((150 * 1024))
          TOTAL=0
          echo "First-load JavaScript budget"
          while IFS= read -r c; do
            [ -z "$c" ] && continue
            # Stdin form, deliberately: `gzip -6 -c <file>` embeds the
            # filename in its header (~25 B per chunk), so the figure
            # would depend on what the file is called. Piping stdin
            # measures content alone and is reproducible by anyone, on
            # any path, with any temp filename. A browser does not
            # download the filename header either.
            SIZE=$(gzip -6 -c < "../web/app/$c" | wc -c | tr -d ' ')
            printf '  %-40s %7s B gzip\n' "$c" "$SIZE"
            TOTAL=$((TOTAL + SIZE))
          done <<< "$CHUNKS"
          printf '  %-40s %7s B gzip\n' "total" "$TOTAL"
          printf '  %-40s %7s B\n' "limit" "$LIMIT"
          printf '  %-40s %7s B\n' "headroom" "$((LIMIT - TOTAL))"

          if [ "$TOTAL" -gt "$LIMIT" ]; then
            echo "::error::first-load JavaScript is $TOTAL B gzip, over the $LIMIT B budget."
            echo "Load a heavy page on demand (see App.tsx lazy imports) or change the budget deliberately in budget.spec.ts and ci.yml."
            exit 1
          fi

      - name: The committed bundle must match the source
        run: |
          if ! git diff --quiet -- web/app; then
            echo "::error::web/app does not match a fresh build of frontend/src."
            echo
            echo "The Go binary embeds web/app, so whatever is committed there is what"
            echo "the product actually serves. A source change without a rebuild means"
            echo "the code you added is not in the running app, and nothing else notices."
            echo
            echo "Fix: cd frontend && pnpm run build, then commit web/app."
            echo
            git diff --stat -- web/app
            exit 1
          fi
          echo "web/app matches frontend/src."
