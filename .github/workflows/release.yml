# Builds HelloGitty for every published tag and gives it a release page.
#
# Every publish gets the next patch tag (v0.2.3), and the page is titled with the patch number in
# brackets after its version: "v0.2.0 (3) - Black Bombay (baby)". Pushing a tag runs this; for a tag
# on an older commit, which predates this file, run it by hand from main with that tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, such as v0.1.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            name="hellogitty_${TAG#v}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$TAG" \
              -o "build/$name/hellogitty$ext" ./cmd/hellogitty
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${TAG#v}"
          shown="$TAG"
          case "$patch" in
            ''|*[!0-9]*) ;;                                  # a prerelease keeps its own name
            0) ;;                                             # the publish that starts a version
            *) shown="v$major.$minor.0 ($patch)" ;;
          esac
          title="$shown"
          if [ "$major" = 0 ]; then title="$title - Black Bombay (baby)"; elif [ "$major" = 1 ]; then title="$title - Black Bombay"; fi
          # Only the highest version is marked latest, so backfilled older tags don't take its place.
          highest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest=false; [ "$TAG" = "$highest" ] && latest=true
          # Notes: the CHANGELOG section headed with this release's name, read from main so that
          # backfilled tags get theirs too; GitHub's list of commits when there is none.
          git show origin/main:CHANGELOG.md 2>/dev/null | awk -v h="## $shown · " '
            index($0, h) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' > notes.md || true
          if grep -q '[^[:space:]]' notes.md; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --latest="$latest"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$title" "${notes[@]}" --latest="$latest"
          fi
